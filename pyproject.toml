[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "auditor-headers-seguranca"
version = "0.1.0"
description = "Auditor de headers HTTP de seguranca (CSP, HSTS, X-Frame-Options, X-Content-Type-Options, Referrer-Policy)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["requests>=2.31.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
auditor-headers = "auditor_headers_seguranca.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
